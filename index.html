<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЖД Бельцкий</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ff9800;
            --btn-bg: #333333;
            --btn-text: #ffffff;
        }

        [data-theme="light"] {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #222222;
            --accent-color: #e65100;
            --btn-bg: #e0e0e0;
            --btn-text: #222222;
        }

        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            text-align: center;
            padding: 20px 0;
            position: relative;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .theme-toggle-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            transition: background-color 0.3s, color 0.3s;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            padding: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }

        .card img {
            width: 100%;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <header>
        <h1>ЖД Бельцкий</h1>
        <p>Фотографии, видео и репортажи с железной дороги</p>
        <button class="theme-toggle-btn" id="themeBtn">☀️ Светлая тема</button>
    </header>

    <main>
        <h2>Свежие кадры</h2>
        <div class="gallery">
            <div class="card">
                <img src="photo1.jpg" alt="Локомотив">
                <h3>Станция Бельцы-Слободзея</h3>
                <p>Тепловоз 2ТЭ116 во главе грузового состава.</p>
            </div>
        </div>
    </main>

    <script>
        const btn = document.getElementById('themeBtn');
        
        btn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            
            if (currentTheme === 'light') {
                document.documentElement.removeAttribute('data-theme');
                btn.textContent = '☀️ Светлая тема';
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                btn.textContent = '🌙 Тёмная тема';
            }
        });
    </script>

</body>
</html>
